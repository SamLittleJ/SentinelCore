# Local development only

services:
  postgres:
    image: postgres:17
    container_name: sentinelcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinelcore
      POSTGRES_PASSWORD: sentinelcore
      POSTGRES_DB: sentinelcore
    ports:
      - "5432:5432"
    volumes:
      - sentinelcore_postgres_data:/var/lib/postgresql/data

  # Prometheus and Grafana use host networking so Prometheus can scrape the
  # backend on localhost:8000 and both listen only on 127.0.0.1. Host
  # networking is fully supported on Linux.
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: sentinelcore-prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      # :z relabels the files for SELinux (Fedora); ignored elsewhere.
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - sentinelcore_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.2.3
    container_name: sentinelcore-grafana
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: sentinelcore
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - sentinelcore_grafana_data:/var/lib/grafana

volumes:
  sentinelcore_postgres_data:
  sentinelcore_prometheus_data:
  sentinelcore_grafana_data:
