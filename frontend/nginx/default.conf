# The console's server: the build, and the API under /api on the same origin,
# as the Vite dev server and `vite preview` serve them. Included by the
# image's nginx.conf inside its http block.
#
# The backend is reached as `sentinelcore-backend:8000`: the Kubernetes
# Service's name, or the container's on a Docker network.

# Requests per address to the ingestion endpoint, before the API's own limit
# per key: a flood of invalid keys from one address stops here (T-38). Kept
# in each nginx process's memory.
limit_req_zone $binary_remote_addr zone=ingest:10m rate=20r/s;
limit_req_status 429;

upstream backend {
    server sentinelcore-backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # The largest ingestion batch (500 events) fits with room to spare.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # For the probes; never reaches the backend.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Metrics stay inside the cluster, answered as any missing route is.
    location = /api/metrics {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
    }

    location /api/ingest {
        limit_req zone=ingest burst=100 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://backend/ingest;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://backend/;
    }

    # The API's own answers carry its headers; nginx's 429 gets the same
    # shape of body.
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"detail":"Too many requests"}';
    }

    # Built files have their content's hash in their name, so they never change.
    location /assets/ {
        include /etc/nginx/snippets/console-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the console; its routes are the browser's.
    location / {
        include /etc/nginx/snippets/console-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
