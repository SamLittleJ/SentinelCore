# How requests reach the backend.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The address nginx saw, replacing anything the client sent: the backend
# trusts this header from nginx only (FORWARDED_ALLOW_IPS), so a client
# cannot pick its own address for the sign-in limit or the detection rules.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
