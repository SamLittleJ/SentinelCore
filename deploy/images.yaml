# The images the GitOps cluster runs: the signed ones CI published from
# main, by digest. `make deploy-pr` checks a commit's signature and
# attestations (scripts/verify-images.sh), writes them here and opens the
# pull request; merging it deploys them. Kyverno checks the signature again
# before each pod starts (kyverno/signatures.yaml).
image:
  backend: ghcr.io/samlittlej/sentinelcore-backend
  console: ghcr.io/samlittlej/sentinelcore-console
  # The commit they were built from; it also labels the pods.
  tag: "96d8b45eeabf"
  digests:
    backend: sha256:87c4423ad1e2a674576179bde0b97b27acf598ac93e3caffbd259a24aab4b9c6
    console: sha256:af06860c7a26520ae8aecf396e2dab7fce7611266262a016c1d970408afd7d4b
