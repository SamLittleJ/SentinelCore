# The flows the application needs in the sentinelcore namespace, and no
# other: applied by scripts/cluster.sh right after the namespace, before any
# pod starts, and checked by `make cluster-check`. Pods are selected by
# app.kubernetes.io/name, as the charts and the owner Job label them.

# Everything is refused unless a policy below allows it; name resolution is
# the one flow every pod keeps.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: sentinelcore
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# nginx: reached from outside through the NodePort, talks only to the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-console
  namespace: sentinelcore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentinelcore-console
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentinelcore-backend
      ports:
        - {protocol: TCP, port: 8000}
---
# The API: reached only by nginx, talks only to the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-backend
  namespace: sentinelcore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentinelcore-backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentinelcore-console
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - {protocol: TCP, port: 5432}
---
# The database: reached by the API and the two Jobs, talks to no one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-postgresql
  namespace: sentinelcore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [sentinelcore-backend, sentinelcore-migrations, sentinelcore-owner]
      ports:
        - {protocol: TCP, port: 5432}
---
# The migrations and the first owner: Jobs that talk only to the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-jobs
  namespace: sentinelcore
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [sentinelcore-migrations, sentinelcore-owner]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - {protocol: TCP, port: 5432}
