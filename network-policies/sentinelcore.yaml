# The flows the application needs in the sentinelcore namespace, and no
# other: applied by scripts/cluster.sh right after the namespace, before any
# pod starts, and checked by `make cluster-check`. Pods are selected by
# app.kubernetes.io/name, as the charts and the owner Job label them.

# Everything is refused unless a policy below allows it; name resolution is
# the one flow every pod keeps.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: sentinelcore
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# nginx: reached from outside through the NodePort, talks only to the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-console
  namespace: sentinelcore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentinelcore-console
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentinelcore-backend
      ports:
        - {protocol: TCP, port: 8000}
---
# The API: reached only by nginx, by falcosidekick (falco.yaml) and by
# Prometheus (observability.yaml); talks only to the database and to the
# Collector, which takes its traces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-backend
  namespace: sentinelcore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentinelcore-backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentinelcore-console
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: falco
          podSelector:
            matchLabels:
              app.kubernetes.io/name: falcosidekick
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        # The canary's synthetic traffic (GitOps cluster), which an analysis
        # sends to the new pods only (charts/sentinelcore, canary.yaml).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentinelcore-canary-traffic
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - {protocol: TCP, port: 4318}
---
# The canary's synthetic traffic: a Job of each analysis, which talks only to
# the API (its canary Service) and to the drill's copy of it; nothing
# reaches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-canary-traffic
  namespace: sentinelcore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentinelcore-canary-traffic
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [sentinelcore-backend, sentinelcore-canary-drill]
      ports:
        - {protocol: TCP, port: 8000}
---
# The canary drill of `make cluster-check CLUSTER=gitops`: a copy of the API
# under its own name, so it is never behind the real Service. Reached only
# by the synthetic traffic and by Prometheus; talks only to the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-canary-drill
  namespace: sentinelcore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentinelcore-canary-drill
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentinelcore-canary-traffic
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - {protocol: TCP, port: 5432}
---
# The database: reached by the API, the Jobs and the canary drill's copy of
# the API; talks to no one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-postgresql
  namespace: sentinelcore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [sentinelcore-backend, sentinelcore-migrations, sentinelcore-owner, sentinelcore-backup, sentinelcore-backup-check, sentinelcore-canary-drill]
      ports:
        - {protocol: TCP, port: 5432}
---
# The migrations, the first owner, the nightly backup and its check: Jobs
# that talk only to the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-jobs
  namespace: sentinelcore
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [sentinelcore-migrations, sentinelcore-owner, sentinelcore-backup, sentinelcore-backup-check]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - {protocol: TCP, port: 5432}
