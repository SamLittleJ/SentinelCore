# What Prometheus (prometheus.yaml) may ask the Kubernetes API: where the
# pods of the sentinelcore namespace are, to scrape the API's. The
# chart creates the ServiceAccount. Nothing in
# other namespaces, and nothing it could change.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: sentinelcore
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: sentinelcore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
