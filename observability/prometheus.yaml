# Prometheus for SentinelCore's kind clusters (scripts/cluster.sh, and Argo
# CD's in GitOps): the server alone, which scrapes each API pod's /metrics
# with the metrics token, keeps two days in the pod's own emptyDir and
# evaluates the SLO rules (observability/slo-rules.yaml), which the chart
# charts/observability-config puts in a ConfigMap of their own.

# The chart's ClusterRole would read the whole cluster; observability/rbac.yaml
# lets it list the API's pods in the sentinelcore namespace only.
rbac:
  create: false
serviceAccounts:
  server:
    name: prometheus

# Reloads Prometheus when its configuration or the SLO rules change, so a
# new rule needs no restart (and Argo CD no hash to compute).
configmapReload:
  prometheus:
    enabled: true
    image:
      repository: quay.io/prometheus-operator/prometheus-config-reloader
      tag: v0.94.2
      digest: sha256:a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71
    extraVolumeDirs: [/etc/sentinelcore-rules]
    extraConfigmapMounts:
      - name: slo-rules-watched
        mountPath: /etc/sentinelcore-rules
        configMap: sentinelcore-slo-rules
        readOnly: true
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]

server:
  image:
    tag: v3.15.1
    digest: sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
  # Asks the Kubernetes API where the pods are.
  automountServiceAccountToken: true
  enableServiceLinks: false
  # The reloader above calls /-/reload, which needs the lifecycle API. It
  # also offers /-/quit: only Grafana and Argo Rollouts' controller reach
  # this port (network-policies/observability.yaml).
  extraFlags: [web.enable-lifecycle]
  retention: 2d
  persistentVolume:
    enabled: false
  emptyDir:
    sizeLimit: 2Gi
  global:
    scrape_interval: 15s
    evaluation_interval: 30s
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: 500m, memory: 512Mi}
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  extraConfigmapMounts:
    - name: slo-rules
      mountPath: /etc/sentinelcore-rules
      configMap: sentinelcore-slo-rules
      readOnly: true
  # METRICS_TOKEN, copied here by cluster.sh from the API's Secret.
  extraSecretMounts:
    - name: metrics-token
      mountPath: /etc/sentinelcore
      secretName: prometheus-metrics-token
      readOnly: true

# Only the SLO rules: alerts stay in Prometheus and Grafana, with no
# Alertmanager to send them (docs/05-slos.md).
serverFiles:
  prometheus.yml:
    rule_files:
      - /etc/sentinelcore-rules/slo-rules.yaml

alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

# Only the API: the chart's jobs for the cluster are off.
scrapeConfigs:
  prometheus:
    enabled: false
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  # The name infra/grafana's dashboard queries.
  sentinelcore-backend:
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [sentinelcore]
        selectors:
          - role: pod
            label: app.kubernetes.io/name=sentinelcore-backend
    authorization:
      credentials_file: /etc/sentinelcore/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "8000"
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  # The canary drill of `make cluster-check CLUSTER=gitops`: the same API,
  # its metrics renamed sentinelcore_drill_*, so the drill's deliberate 500s
  # never reach the SLOs (slo-rules.yaml), which read sentinelcore_*.
  sentinelcore-canary-drill:
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [sentinelcore]
        selectors:
          - role: pod
            label: app.kubernetes.io/name=sentinelcore-canary-drill
    authorization:
      credentials_file: /etc/sentinelcore/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "8000"
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: sentinelcore_(.*)
        target_label: __name__
        replacement: sentinelcore_drill_$1
