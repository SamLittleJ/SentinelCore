# The previews of pull requests (docs/07-gitops.md, Previews), in the
# namespaces labelled sentinelcore/preview, which only charts/preview makes:
# the GitOps cluster's application lets no pull request create a namespace.
# The same rules as sentinelcore's (pod-rules.yaml, signatures.yaml, which
# `make deploy-lint` keeps equal), with two differences: the images may also
# come from preview-images.yml on a pull request, and the Job that creates a
# preview's Secrets may mount its token. `sentinelcore` itself never accepts
# a pull request's image.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: sentinelcore-preview-pods
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        sentinelcore/preview: "true"
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false))
      message: Every container needs securityContext.readOnlyRootFilesystem true.
    - expression: >-
        variables.containers.all(c, ['cpu', 'memory'].all(r,
          c.?resources.?requests[?r].hasValue() && c.?resources.?limits[?r].hasValue()))
      message: Every container needs CPU and memory requests and limits.
    # The Secrets' Job alone, under its own account, which may only read and
    # create Secrets here (charts/preview/templates/secrets.yaml).
    - expression: >-
        object.spec.?automountServiceAccountToken.orValue(true) == false ||
          object.spec.?serviceAccountName.orValue('') == 'preview-secrets'
      message: Only the preview-secrets Job talks to the Kubernetes API; set automountServiceAccountToken false.
    # By digest: the signature policy below resolves a pull request's tag to
    # its digest before this rule runs.
    - expression: >-
        variables.containers.all(c, c.image.matches('^[^@]+@sha256:[0-9a-f]{64}$'))
      messageExpression: >-
        'Images must be pinned by digest (name@sha256:...): ' + variables.containers
          .filter(c, !c.image.contains('@sha256:')).map(c, c.image).join(', ')
---
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: sentinelcore-preview-signatures
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        sentinelcore/preview: "true"
  matchImageReferences:
    - glob: ghcr.io/samlittlej/sentinelcore-*
  validationConfigurations:
    # A pull request's images are named by its commit (pr-<sha>), which the
    # ApplicationSet knows, not by digest: the tag is resolved once, here,
    # and the pod runs the digest that was checked.
    mutateDigest: true
    verifyDigest: false
    required: true
  attestors:
    - name: images
      cosign:
        keyless:
          identities:
            - subjectRegExp: ^https://github\.com/SamLittleJ/SentinelCore/\.github/workflows/preview-images\.yml@refs/pull/[0-9]+/merge$
              issuer: https://token.actions.githubusercontent.com
            - subject: https://github.com/SamLittleJ/SentinelCore/.github/workflows/images-ci.yml@refs/heads/main
              issuer: https://token.actions.githubusercontent.com
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
    - name: sbom
      intoto:
        type: https://spdx.dev/Document/v2.3
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.images])).all(n, n > 0)
      message: The image is not signed by preview-images.yml on a pull request or images-ci.yml on main.
    - expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.provenance, [attestors.images])).all(n, n > 0)
      message: The image has no SLSA provenance from preview-images.yml or images-ci.yml.
    - expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.images])).all(n, n > 0)
      message: The image has no SPDX SBOM attestation from preview-images.yml or images-ci.yml.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: sentinelcore-preview-registry-images
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        sentinelcore/preview: "true"
  validations:
    - expression: >-
        (object.spec.containers + object.spec.?initContainers.orValue([]))
          .all(c, !c.image.startsWith('sentinelcore-'))
      message: In this cluster, SentinelCore's images come from ghcr.io/samlittlej, by digest.
