# What every pod in the sentinelcore namespace must be, beyond the
# Kubernetes "restricted" Pod Security Standard the namespace enforces
# (scripts/cluster.sh): no root, no privilege escalation, no added
# capabilities. Each rule is refused at admission, and
# scripts/cluster-check.sh proves it with a pod that breaks it.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: sentinelcore-pods
spec:
  validationActions: [Deny]
  # Without an answer from Kyverno, the API server refuses the pod.
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: sentinelcore
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.?securityContext.?readOnlyRootFilesystem.orValue(false))
      message: Every container needs securityContext.readOnlyRootFilesystem true.
    - expression: >-
        variables.containers.all(c, ['cpu', 'memory'].all(r,
          c.?resources.?requests[?r].hasValue() && c.?resources.?limits[?r].hasValue()))
      message: Every container needs CPU and memory requests and limits.
    - expression: object.spec.?automountServiceAccountToken.orValue(true) == false
      message: No pod here talks to the Kubernetes API; set automountServiceAccountToken false.
    # Ours are checked by their signature instead (signatures.yaml): local
    # builds (`make up`) carry the commit as their tag.
    - expression: >-
        variables.containers.all(c, c.image.matches(
          '^(sentinelcore-(backend|console):[0-9a-f]{12}(-dirty)?|[^@]+@sha256:[0-9a-f]{64})$'))
      messageExpression: >-
        'Images must be pinned by digest (name@sha256:...): ' + variables.containers
          .filter(c, !c.image.contains('@sha256:')).map(c, c.image).join(', ')
