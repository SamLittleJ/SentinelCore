name: CodeQL

# Static analysis of the backend, the console and these workflows, with the
# security-extended queries. Results go to the repository's Security tab and
# show on the pull request. Weekly as well: a new query can find an old flaw.
on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    schedule:
        - cron: "17 4 * * 1"

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze ${{ matrix.language }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Only this job may upload results.
        permissions:
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                # actions: the workflows themselves, for example an untrusted
                # pull request title expanded inside a `run:` step.
                language: [python, javascript-typescript, actions]

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # None of the three needs a build: the code is read as written.
            - name: Initialize CodeQL
              uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  queries: security-extended

            - name: Analyze
              uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  category: /language:${{ matrix.language }}
