name: Frontend CI

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - "frontend/**"
            - ".github/workflows/frontend-ci.yml"
    pull_request:
        branches:
            - main

# The jobs only read the code; the token gets no write access.
permissions:
    contents: read

jobs:
    frontend-checks:
        name: Lint, type check, test and build
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Audit dependencies
              run: npm audit --audit-level=high

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run typecheck

            - name: Run tests
              run: npm test

            - name: Build
              run: npm run build
