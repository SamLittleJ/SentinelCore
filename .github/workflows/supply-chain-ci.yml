name: Supply chain CI

# `make scan`, as locally: the backend's locked dependencies against known
# vulnerabilities (pip-audit) and the deployment's files against
# misconfigurations (Checkov). Every week as well, since a new advisory can
# make an unchanged dependency vulnerable.
on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    schedule:
        - cron: "37 4 * * 1"

# The jobs only read the code; the token gets no write access.
permissions:
    contents: read

jobs:
    scan:
        name: Scan dependencies and deployment files
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The Python security/scanners.lock was resolved for.
            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.12"

            - name: Run make scan
              run: make scan
