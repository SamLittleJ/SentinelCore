name: Images CI

# The backend and console images: built with `make images`, listed in an
# SBOM by Syft and scanned by Grype (`make scan-images`). On pull requests
# that change them, nothing is published. On every push to main, the scanned
# images are published to GHCR under the commit's short SHA, so each commit
# of main has its images. Weekly, main's published images are scanned again
# against the newest vulnerabilities.
on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
        paths:
            - "backend/**"
            - "frontend/**"
            - "scripts/scan-images.sh"
            - "scripts/scan_gate.py"
            - "scripts/tools.sh"
            - "security/**"
            - "Makefile"
            - ".github/workflows/images-ci.yml"
    schedule:
        - cron: "47 4 * * 1"

# The jobs only read the code; only the publish job may write packages.
permissions:
    contents: read

env:
    REGISTRY: ghcr.io/samlittlej

jobs:
    scan:
        name: Build, list and scan the images
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            # The Python security/scanners.lock was resolved for (the gate).
            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.12"

            - name: Run make scan-images
              run: make scan-images

            # The exact images scanned, for the publish job: it pushes these,
            # not a second build.
            - name: Save the images
              if: github.event_name == 'push'
              run: |
                  revision="$(git rev-parse --short=12 HEAD)"
                  echo "$revision" > .scan/revision
                  docker save -o .scan/images.tar \
                      "sentinelcore-backend:$revision" "sentinelcore-console:$revision"

            - name: Keep the SBOMs and reports
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: image-scan
                  path: |
                      .scan/*.spdx.json
                      .scan/grype-*.json
                      .scan/gate.txt
                  retention-days: 90

            - name: Keep the images for publishing
              if: github.event_name == 'push'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: images
                  path: |
                      .scan/images.tar
                      .scan/revision
                  retention-days: 1

    publish:
        name: Publish the images to GHCR
        needs: scan
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            packages: write

        steps:
            - name: Get the scanned images
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: images

            # The token reaches only this step, through standard input.
            - name: Push to GHCR
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  revision="$(cat revision)"
                  docker load -i images.tar
                  echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
                  {
                      echo "### Published images"
                      echo
                  } >> "$GITHUB_STEP_SUMMARY"
                  for image in backend console; do
                      target="$REGISTRY/sentinelcore-$image:$revision"
                      docker tag "sentinelcore-$image:$revision" "$target"
                      docker push --quiet "$target"
                      echo "- \`$(docker inspect --format '{{index .RepoDigests 0}}' "$target")\`" >> "$GITHUB_STEP_SUMMARY"
                  done
                  docker logout ghcr.io

    rescan:
        name: Scan main's published images again
        if: github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.12"

            - name: Pull the images
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  revision="$(git rev-parse --short=12 HEAD)"
                  echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
                  for image in backend console; do
                      docker pull --quiet "$REGISTRY/sentinelcore-$image:$revision"
                  done
                  docker logout ghcr.io

            - name: Scan them
              run: |
                  revision="$(git rev-parse --short=12 HEAD)"
                  ./scripts/scan-images.sh \
                      "$REGISTRY/sentinelcore-backend:$revision" "$REGISTRY/sentinelcore-console:$revision"

            - name: Keep the SBOMs and reports
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: image-rescan
                  path: |
                      .scan/*.spdx.json
                      .scan/grype-*.json
                      .scan/gate.txt
                  retention-days: 90
