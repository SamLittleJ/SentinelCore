name: Backend CI

on:
    workflow_dispatch:
    push:
        branches: 
            - main
        paths:
            - "backend/**"
            - "scripts/tools.sh"
            - ".github/workflows/backend-ci.yml"
    pull_request:
        branches:
            - main
        
# The jobs only read the code; the token gets no write access.
permissions:
    contents: read

jobs:
    backend-tests:
        name: Run backend tests
        runs-on: ubuntu-latest

        services:
            postgres:
                # Pinned by digest and updated by hand: Dependabot does not
                # read the images of workflow services.
                image: postgres:17@sha256:a63c1ea3f6a3a5a1621f97d2aba3b30faecfab4224c1b0000cc85ced57bb1939
                env:
                    POSTGRES_USER: sentinelcore
                    POSTGRES_PASSWORD: sentinelcore
                    POSTGRES_DB: sentinelcore_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U sentinelcore -d sentinelcore_test"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        env:
            TEST_DATABASE_URL: postgresql+psycopg://sentinelcore:sentinelcore@localhost:5432/sentinelcore_test
            DATABASE_URL: postgresql+psycopg://sentinelcore:sentinelcore@localhost:5432/sentinelcore_test
            SECRET_KEY: ci-test-secret-key-for-sentinelcore-minimum-32-bytes
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                    python-version: '3.12'
            
            - name: Install backend dependencies
              working-directory: backend
              # The image's pinned versions first, so the tests run on them.
              run: |
                python -m pip install --upgrade pip
                python -m pip install --require-hashes -r requirements.lock
                python -m pip install -e ".[dev]"

            - name: Check the lockfile matches pyproject.toml
              working-directory: backend
              # uv keeps the pins already in the file, so this fails only when
              # pyproject.toml changed and `make lock` was not run.
              run: |
                cp requirements.lock "$RUNNER_TEMP/requirements.lock"
                uv pip compile pyproject.toml --generate-hashes \
                  --python-version 3.12 --python-platform x86_64-manylinux_2_28 \
                  --no-header --quiet -o "$RUNNER_TEMP/requirements.lock"
                diff -u requirements.lock "$RUNNER_TEMP/requirements.lock"

            - name: Run Ruff Lint
              working-directory: backend
              run: |
                python -m ruff check .

            - name: Run Ruff format check
              working-directory: backend
              run: |
                python -m ruff format --check .

            - name: Run Bandit security scan
              working-directory: backend
              run: |
                python -m bandit -r app simulator -c pyproject.toml

            - name: Run backend tests
              working-directory: backend
              run: |
                python -m pytest -v
    
    gitleaks:
        name: Run Gitleaks secret scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                fetch-depth: 0  # Fetch all history for Gitleaks to scan the entire commit history

            # The pinned binary of scripts/tools.sh, as in `make verify`;
            # --redact keeps any secret found out of the log.
            - name: Run Gitleaks
              run: |
                PATH="$(./scripts/tools.sh gitleaks):$PATH"
                gitleaks git --redact --verbose .