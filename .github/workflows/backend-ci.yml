name: Backend CI

on:
    workflow_dispatch:
    push:
        branches: 
            - main
        paths:
            - "backend/**"
            - ".github/workflows/backend-ci.yml"
    pull_request:
        branches:
            - main
        
# The jobs only read the code; the token gets no write access.
permissions:
    contents: read

jobs:
    backend-tests:
        name: Run backend tests
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: sentinelcore
                    POSTGRES_PASSWORD: sentinelcore
                    POSTGRES_DB: sentinelcore_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U sentinelcore -d sentinelcore_test"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        env:
            TEST_DATABASE_URL: postgresql+psycopg://sentinelcore:sentinelcore@localhost:5432/sentinelcore_test
            DATABASE_URL: postgresql+psycopg://sentinelcore:sentinelcore@localhost:5432/sentinelcore_test
            SECRET_KEY: ci-test-secret-key-for-sentinelcore-minimum-32-bytes
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                    python-version: '3.12'
            
            - name: Install backend dependencies
              working-directory: backend
              run: |
                python -m pip install --upgrade pip
                python -m pip install -e ".[dev]"

            - name: Run Ruff Lint
              working-directory: backend
              run: |
                python -m ruff check .

            - name: Run Ruff format check
              working-directory: backend
              run: |
                python -m ruff format --check .

            - name: Run Bandit security scan
              working-directory: backend
              run: |
                python -m bandit -r app simulator -c pyproject.toml

            - name: Run backend tests
              working-directory: backend
              run: |
                python -m pytest -v
    
    gitleaks:
        name: Run Gitleaks secret scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                fetch-depth: 0  # Fetch all history for Gitleaks to scan the entire commit history

            - name: Run Gitleaks with Docker
              run: |
                docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest detect --source=/repo --verbose