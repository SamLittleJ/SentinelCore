# Dependabot keeps the pinned dependencies current: once a week, one pull
# request per ecosystem. A new version is proposed only after 7 days, so a
# release pulled back soon after publication (a hijacked package, a
# force-pushed tag) never reaches a pull request. Security updates skip the
# wait. The tools of scripts/tools.sh and the image of the CI's Postgres
# service are updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # The backend's pyproject.toml; requirements.lock is regenerated by
  # `uv pip compile`, and the lock check fails if it was not.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]

  # The base images of both Dockerfiles, pinned by digest.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      images:
        patterns: ["*"]

  # docker-compose.yml: Postgres, Prometheus and Grafana for development.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      compose:
        patterns: ["*"]
