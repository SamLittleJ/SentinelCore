{{- /*
The flows a preview needs, and no other: nothing reaches it from another
namespace and it reaches none, so a preview and `sentinelcore` cannot talk.
From main, so a pull request's charts cannot widen them.
*/ -}}
{{- define "preview.dns" -}}
- to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
{{- end }}
{{- $wave := dict "argocd.argoproj.io/sync-wave" "-2" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  annotations: {{ toYaml $wave | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "preview.dns" . | nindent 4 }}
---
# nginx: reached only through `make preview` (a port-forward, which no
# policy sees); talks only to the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-console
  annotations: {{ toYaml $wave | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentinelcore-console
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentinelcore-backend
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-backend
  annotations: {{ toYaml $wave | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentinelcore-backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentinelcore-console
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - {protocol: TCP, port: 5432}
---
# The migrations and the owner's Job talk only to the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-jobs
  annotations: {{ toYaml $wave | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [sentinelcore-migrations, sentinelcore-owner]
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinelcore-postgresql
  annotations: {{ toYaml $wave | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [sentinelcore-backend, sentinelcore-migrations, sentinelcore-owner]
      ports:
        - {protocol: TCP, port: 5432}
---
# The Secrets' Job talks only to the Kubernetes API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: preview-secrets
  annotations: {{ toYaml $wave | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: preview-secrets
  policyTypes: [Ingress, Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 6443}
