{{- /*
The preview's Secrets (app/preview_secrets.py), created once before the
database starts. The Job's service account may only read and create
Secrets in this namespace; it is the one pod of a preview that Kyverno lets
mount a token (kyverno/previews.yaml). A hook of every sync, as the script
changes nothing once the Secrets exist.
*/ -}}
{{- $image := .Values.image.backend -}}
{{- $image = ternary (printf "%s@%s" $image .Values.image.digests.backend) (printf "%s:%s" $image (required "image.tag names main's backend image" .Values.image.tag)) (ne .Values.image.digests.backend "") -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: preview-secrets
subjects:
  - kind: ServiceAccount
    name: preview-secrets
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: preview-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  preview_secrets.py: |
    {{- .Files.Get "files/preview_secrets.py" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: preview-secrets
  labels:
    app.kubernetes.io/name: preview-secrets
    app.kubernetes.io/part-of: sentinelcore
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preview-secrets
    spec:
      restartPolicy: Never
      serviceAccountName: preview-secrets
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secrets
          image: {{ $image | quote }}
          command: ["python", "/preview/preview_secrets.py"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /preview
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: preview-secrets
