# Built and loaded into the cluster by `make up` (`make images`), tagged with
# the short commit. The tag has no default: an install names what it runs.
image:
  backend: sentinelcore-backend
  console: sentinelcore-console
  tag: ""
  pullPolicy: IfNotPresent
  # The images' own IDs, set by `make up`: a rebuild under the same tag
  # (`-dirty`) changes them, so the pods are replaced.
  ids:
    backend: ""
    console: ""
  # `make up FROM=registry`: the verified digests, with backend and console
  # set to ghcr.io/samlittlej/sentinelcore-*. The tag still labels the pods.
  digests:
    backend: ""
    console: ""

# Created by `make up` when missing, never written here.
secrets:
  # SECRET_KEY, AUDIT_CHAIN_KEY, METRICS_TOKEN, DATABASE_URL (the API's role).
  api: sentinelcore-api
  # MIGRATIONS_DATABASE_URL (the owner of the tables): the migration Job only.
  migrations: sentinelcore-migrations
  # FALCO_INGEST_TOKEN, which falcosidekick sends (scripts/cluster.sh).
  falco: sentinelcore-falco

backend:
  replicas: 2
  # The canary of the GitOps cluster (deploy/sentinelcore.yaml turns it on;
  # docs/07-gitops.md): a Rollout instead of the Deployment, Argo Rollouts
  # running it. Each step sets the new version's share of the pods, then an
  # analysis sends it synthetic traffic and reads its 5xx rate in Prometheus.
  canary:
    enabled: false
    steps: [20, 60]
    analysis:
      # How long the traffic lasts, how fast, and how often the error rate
      # is read; the drill of `make cluster-check` passes shorter ones.
      trafficSeconds: 120
      rate: 5
      interval: 30s
      count: 4
      # Fails above this share of 5xx, or with fewer requests than this:
      # an analysis without traffic must not pass.
      maxErrorRatio: "0.01"
      minRequests: 100
      prometheus: http://prometheus-server.observability.svc.cluster.local
  # The settings the API runs with in the cluster (app/core/config.py).
  config:
    API_DOCS_ENABLED: "false"
    LOG_FORMAT: json
    HSTS_MAX_AGE: "0"
    # The pod network (kind's default): nginx's address, the only one whose
    # X-Forwarded-For the API believes.
    FORWARDED_ALLOW_IPS: 10.244.0.0/16
    # The Collector of observability/collector.yaml: traces over OTLP/HTTP.
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

console:
  replicas: 1
  # kind maps it to 127.0.0.1:8080 (kind/kind-config.yaml).
  nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# A preview's first owner (templates/owner.yaml), from the Secret its Jobs
# made: the email the demo's simulator signs in with (`make preview SEED=1`).
owner:
  enabled: false
  email: owner@sim.example.com
  username: owner
  secret: preview-owner
