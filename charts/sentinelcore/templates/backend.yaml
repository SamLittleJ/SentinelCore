{{- if .Values.backend.canary.enabled }}
# The GitOps cluster: a canary, run by Argo Rollouts (canary.yaml,
# docs/07-gitops.md). A new version gets one pod in five, then three, each
# step after an analysis of its errors; a failed analysis takes it back.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: sentinelcore-backend
  labels:
    app.kubernetes.io/name: sentinelcore-backend
    {{- include "sentinelcore.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  {{- if .Values.backend.canary.enabled }}
  revisionHistoryLimit: 3
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelcore-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    {{- include "sentinelcore.backendPod" . | nindent 4 }}
  {{- if .Values.backend.canary.enabled }}
  strategy:
    canary:
      # The new pods only, for the analysis's traffic; the real Service keeps
      # both versions, so users get the canary's share of requests.
      canaryService: sentinelcore-backend-canary
      steps:
        {{- range .Values.backend.canary.steps }}
        - setWeight: {{ . }}
        - analysis:
            templates:
              - templateName: sentinelcore-canary
            args:
              {{- include "sentinelcore.canaryArgs" $ | nindent 14 }}
        {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # The name nginx sends /api to (frontend/nginx/default.conf).
  name: sentinelcore-backend
  labels:
    app.kubernetes.io/name: sentinelcore-backend
    {{- include "sentinelcore.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: sentinelcore-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8000
      targetPort: http
