# Before each install or upgrade, and before the new API pods start: the
# migrations, then the API's role allowed to sign in. Only this Job has the
# owner's URL. A failed Job is kept for its logs and not retried.
{{- $hook := "pre-install,pre-upgrade" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinelcore-migrations
  labels:
    {{- include "sentinelcore.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sentinelcore-migrations
  labels:
    app.kubernetes.io/name: sentinelcore-migrations
    {{- include "sentinelcore.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $hook }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelcore-migrations
        {{- include "sentinelcore.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: sentinelcore-migrations
      automountServiceAccountToken: false
      securityContext:
        {{- include "sentinelcore.podSecurity" . | nindent 8 }}
        {{- include "sentinelcore.backendUser" . | nindent 8 }}
      containers:
        - name: migrations
          image: "{{ include "sentinelcore.image" (list . "backend") }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "alembic upgrade head && python -m app.cli grant-api-login"]
          env:
            {{- include "sentinelcore.backendEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.api }}
            - secretRef:
                name: {{ .Values.secrets.migrations }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "sentinelcore.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
