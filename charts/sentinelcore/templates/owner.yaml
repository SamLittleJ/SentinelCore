{{- /*
A preview's first owner (docs/07-gitops.md, Previews), after each sync: the
same command `make up` runs, with the password the preview's Secrets Job
made (charts/preview). `make up` and the GitOps cluster create theirs from
their scripts instead, so it is off by default.
*/ -}}
{{- if .Values.owner.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: sentinelcore-owner
  labels:
    app.kubernetes.io/name: sentinelcore-owner
    {{- include "sentinelcore.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelcore-owner
        {{- include "sentinelcore.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: sentinelcore-backend
      automountServiceAccountToken: false
      securityContext:
        {{- include "sentinelcore.podSecurity" . | nindent 8 }}
        {{- include "sentinelcore.backendUser" . | nindent 8 }}
      containers:
        - name: owner
          image: "{{ include "sentinelcore.image" (list . "backend") }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["python", "-m", "app.cli", "create-owner", "--email", {{ .Values.owner.email | quote }},
                 "--username", {{ .Values.owner.username | quote }}, "--if-missing"]
          env:
            {{- include "sentinelcore.backendEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.api }}
            - secretRef:
                name: {{ .Values.owner.secret }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "sentinelcore.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
