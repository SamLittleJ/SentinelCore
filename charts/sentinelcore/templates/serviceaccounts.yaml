# One account per workload, none with a token: nothing here calls the
# Kubernetes API.
{{- range list "sentinelcore-backend" "sentinelcore-console" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  labels:
    {{- include "sentinelcore.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
