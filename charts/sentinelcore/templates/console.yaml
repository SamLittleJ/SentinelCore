apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelcore-console
  labels:
    app.kubernetes.io/name: sentinelcore-console
    {{- include "sentinelcore.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelcore-console
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelcore-console
        {{- include "sentinelcore.labels" . | nindent 8 }}
      annotations:
        sentinelcore/image-id: {{ .Values.image.ids.console | quote }}
    spec:
      serviceAccountName: sentinelcore-console
      automountServiceAccountToken: false
      securityContext:
        {{- include "sentinelcore.podSecurity" . | nindent 8 }}
      containers:
        - name: console
          image: "{{ .Values.image.console }}:{{ include "sentinelcore.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          securityContext:
            {{- include "sentinelcore.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # nginx's pid file and buffers; nothing else is written.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelcore-console
  labels:
    app.kubernetes.io/name: sentinelcore-console
    {{- include "sentinelcore.labels" . | nindent 4 }}
spec:
  type: NodePort
  # Traffic stays on the node it arrived at, so nginx sees the sender's
  # address rather than another node's.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: sentinelcore-console
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: {{ .Values.console.nodePort }}
