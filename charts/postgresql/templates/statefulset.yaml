apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinelcore-postgresql
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  serviceName: sentinelcore-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "postgresql.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postgresql.labels" . | nindent 8 }}
    spec:
      serviceAccountName: sentinelcore-postgresql
      automountServiceAccountToken: false
      securityContext:
        # The image's postgres user; the disk is made writable for its group.
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # A subdirectory: the disk's root may hold lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: {{ .Values.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.user | quote }}
            # Read from a file, so the password is not in the process's
            # environment.
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgresql/password
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ .Values.user | quote }}, "-d", {{ .Values.database | quote }}]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ .Values.user | quote }}, "-d", {{ .Values.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: password
              mountPath: /run/secrets/postgresql
              readOnly: true
            # The only places PostgreSQL writes outside its data.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: password
          secret:
            secretName: {{ .Values.passwordSecret }}
            defaultMode: 0440
            items:
              - key: password
                path: password
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "postgresql.selector" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
