[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelcore-backend"
version = "0.1.0"
description = "Backend API for SentinelCore"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.42",
    "sqlalchemy>=2.0.49",
    "psycopg[binary]>=3.3",
    "alembic>=1.18",
    "pydantic[email]>=2.12",
    "pydantic-settings>=2.13",
    "pwdlib[argon2]>=0.3",
    "PyJWT>=2.12",
    "prometheus-client>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
    "ruff==0.15.17",
    "bandit[toml]>=1.9",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
skips = []